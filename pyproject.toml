[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoedit"
version = "0.1.0"
description = "Montaggio automatico stile TikTok/CapCut: foto+video + una canzone, tagli sincronizzati sul beat reale. Tutto in locale."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "opodark" }]
keywords = ["video", "editing", "tiktok", "reels", "beat-sync", "ffmpeg", "montage"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
dependencies = [
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy>=1.24",
    "scipy>=1.10",
    "pillow>=10.0",
]

[project.optional-dependencies]
gui = ["gradio>=4.0"]
ai = ["openai>=1.40", "anthropic>=0.40"]
svg = ["cairosvg>=2.7"]                       # rasterizza SVG grezzo (alternativa: binario 'resvg' sul PATH)
all = ["gradio>=4.0", "openai>=1.40", "anthropic>=0.40", "cairosvg>=2.7"]

[project.scripts]
autoedit = "autoedit.cli:main"

[project.urls]
Homepage = "https://github.com/opodark/tiktok_editor"
Issues = "https://github.com/opodark/tiktok_editor/issues"

[tool.setuptools]
packages = ["autoedit"]

[tool.setuptools.package-data]
autoedit = ["py.typed", "assets_data/fonts/*.ttf", "assets_data/fonts/*.txt"]
